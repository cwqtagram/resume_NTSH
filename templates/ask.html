<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中韓中日翻譯</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            text-align: center;
            margin: 0;
            padding: 30px;
            color: #333;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }

        h1 {
            color: #1565c0;
        }

        input, select {
            padding: 12px;
            width: 90%;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #1565c0;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 10px;
        }

        a {
            color: #1565c0;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>中韓中日翻譯系統</h1>

    <form method="POST" action="/ask">

        <label>選擇翻譯語言：</label>

        <select name="language">

            <option value="ko"
                {% if language == 'ko' %}selected{% endif %}>
                韓文
            </option>

            <option value="jp"
                {% if language == 'jp' %}selected{% endif %}>
                日文
            </option>

        </select>

        <br>

        <label>請輸入中文或外文：</label>

        <input
            type="text"
            name="question"
            placeholder="例如：你好"
            value="{{ question }}"
            required
        >

        <br>

        <button type="submit">開始翻譯</button>

    </form>

    {% if answer %}

    <div class="result">

        <h2>翻譯結果</h2>

        <p>輸入：{{ question }}</p>

        <p>翻譯：{{ answer }}</p>

    </div>

    {% endif %}

    <br><br>

    <a href="/">← 返回首頁</a>

</div>

</body>
</html>
