<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>中日翻譯字典</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #e3f2fd, #ffffff);
            margin: 0;
            padding: 0;
            color: #333;
        }

        header {
            background-color: #1565c0;
            color: white;
            text-align: center;
            padding: 30px;
        }

        .container {
            max-width: 600px;
            margin: 40px auto;
            padding: 25px;
            background-color: white;
            border-radius: 15px;
            box-shadow: 0 6px 15px rgba(0,0,0,0.1);
        }

        input {
            width: 95%;
            padding: 12px;
            margin: 15px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        button {
            background-color: #1565c0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0d47a1;
        }

        .result {
            margin-top: 25px;
            padding: 15px;
            background-color: #e3f2fd;
            border-radius: 10px;
        }

        a {
            color: #1565c0;
            text-decoration: none;
        }
    </style>
</head>

<body>

<header>
    <h1>📚 中日翻譯字典</h1>
    <p>中文與日文雙向翻譯</p>
</header>

<div class="container">

    <h2>請輸入中文或日文</h2>

    <form method="POST" action="/ask2">

        <input
            type="text"
            name="question"
            placeholder="例如：你好、こんにちは"
            value="{{ question }}"
            required
        >

        <button type="submit">開始翻譯</button>

    </form>

    {% if answer %}
    <div class="result">
        <h3>翻譯結果：</h3>
        <p>{{ answer }}</p>
    </div>
    {% endif %}

    <br>

    <a href="/">← 返回首頁</a>

</div>

</body>
</html>
